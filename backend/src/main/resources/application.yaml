spring:
  application:
    name: jochook-on-api
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hana_fc}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:hana_app}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jochookon:
  bootstrap:
    admin:
      # Keep existing local and deployed bootstrap settings working after the rename.
      username: ${JOCHOOK_ON_BOOTSTRAP_USERNAME:${hana.bootstrap.admin.username:${HANA_BOOTSTRAP_USERNAME:}}}
      password: ${JOCHOOK_ON_BOOTSTRAP_PASSWORD:${hana.bootstrap.admin.password:${HANA_BOOTSTRAP_PASSWORD:}}}
