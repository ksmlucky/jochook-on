name: jochook-on-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hana_fc}
      MYSQL_USER: ${MYSQL_USER:-hana_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hana_fc}
      MYSQL_USER: ${MYSQL_USER:-hana_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      JOCHOOK_ON_BOOTSTRAP_USERNAME: ${JOCHOOK_ON_BOOTSTRAP_USERNAME:-${HANA_BOOTSTRAP_USERNAME:-}}
      JOCHOOK_ON_BOOTSTRAP_PASSWORD: ${JOCHOOK_ON_BOOTSTRAP_PASSWORD:-${HANA_BOOTSTRAP_PASSWORD:-}}
      JOCHOOK_ON_SERVICE_ADMIN_USERNAME: ${JOCHOOK_ON_SERVICE_ADMIN_USERNAME:-}
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      JOCHOOK_ON_SITE_ADDRESS: ${JOCHOOK_ON_SITE_ADDRESS:-${HANA_SITE_ADDRESS:?Set your domain in JOCHOOK_ON_SITE_ADDRESS}}
    ports:
      - '${JOCHOOK_ON_BIND_ADDRESS:-${HANA_BIND_ADDRESS:-127.0.0.1}}:${JOCHOOK_ON_HTTP_PORT:-${HANA_HTTP_PORT:-80}}:80'
      - '${JOCHOOK_ON_BIND_ADDRESS:-${HANA_BIND_ADDRESS:-127.0.0.1}}:${JOCHOOK_ON_HTTPS_PORT:-${HANA_HTTPS_PORT:-443}}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  mysql-data:
    name: ${JOCHOOK_ON_MYSQL_VOLUME:-hana-fc-production_mysql-data}
  caddy-data:
    name: ${JOCHOOK_ON_CADDY_DATA_VOLUME:-hana-fc-production_caddy-data}
  caddy-config:
    name: ${JOCHOOK_ON_CADDY_CONFIG_VOLUME:-hana-fc-production_caddy-config}
