<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" role="img" aria-labelledby="title desc"><title id="title">조축ON 자체전 팀 배정과 3백 배치</title><desc id="desc">운영 배포 전 로컬 기능. 3-5-2는 CAM과 두 CM, 양쪽 윙백을 엇갈리게 배치하고 3-4-3은 LM과 RM을 사용한다. 01에서 A B를 정한 뒤 02 계획은 팀을 유지하고 03은 실제 출전을 기록한다.</desc><rect width="1240" height="1190" fill="#f6f8f3"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="42" y="42" font-size="18" fill="#28654d" text-anchor="start" font-weight="700">JOCHOOK ON  /  조축ON</text><text x="1198" y="42" font-size="17" fill="#657a6f" text-anchor="end" font-weight="400">2026-10-15 · 로컬 기능 · 운영 배포 전</text><text x="42" y="96" font-size="34" fill="#244438" text-anchor="start" font-weight="700">팀을 먼저 나누고, 함께 정한 작전대로</text><text x="42" y="135" font-size="20" fill="#657a6f" text-anchor="start" font-weight="400">01의 A·B 배정을 02 계획에 유지합니다. 03에는 실제 출전과 기록을 남깁니다.</text><rect x="42" y="165" width="556" height="610" rx="16" fill="#fff" stroke="#cdddcf"/><text x="66" y="209" font-size="30" fill="#28654d" text-anchor="start" font-weight="700">3-5-2</text><rect x="62" y="233" width="516" height="510" rx="8" fill="#e9f2e2" stroke="#b8cfb4"/><path d="M 70 488 H 570" stroke="#9ab595"/><circle cx="320" cy="488" r="54" fill="none" stroke="#9ab595"/><path d="M 216.79999999999998 233 V 283 H 423.2 V 233 M 216.79999999999998 743 V 693 H 423.2 V 743" fill="none" stroke="#9ab595"/><rect x="204.44" y="271.2" width="66" height="46" rx="11" fill="#fff0f2" stroke="#e6a1b0"/><text x="237.44" y="301.2" font-size="19" fill="#a82e46" text-anchor="middle" font-weight="700">ST</text><rect x="369.56" y="271.2" width="66" height="46" rx="11" fill="#fff0f2" stroke="#e6a1b0"/><text x="402.56" y="301.2" font-size="19" fill="#a82e46" text-anchor="middle" font-weight="700">ST</text><rect x="287" y="347.7" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="320" y="377.7" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">CAM</text><rect x="80.6" y="403.8" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="113.6" y="433.8" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">LWB</text><rect x="493.4" y="403.8" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="526.4" y="433.8" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">RWB</text><rect x="209.6" y="459.9" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="242.6" y="489.9" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">CM</text><rect x="364.4" y="459.9" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="397.4" y="489.9" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">CM</text><rect x="147.68" y="561.9" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="180.68" y="591.9" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">LCB</text><rect x="287" y="592.5" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="320" y="622.5" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">CB</text><rect x="426.32" y="561.9" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="459.32" y="591.9" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">RCB</text><rect x="287" y="674.1" width="66" height="46" rx="11" fill="#fff3cd" stroke="#ddbd69"/><text x="320" y="704.1" font-size="19" fill="#865a04" text-anchor="middle" font-weight="700">GK</text><rect x="640" y="165" width="556" height="610" rx="16" fill="#fff" stroke="#cdddcf"/><text x="664" y="209" font-size="30" fill="#28654d" text-anchor="start" font-weight="700">3-4-3</text><rect x="660" y="233" width="516" height="510" rx="8" fill="#e9f2e2" stroke="#b8cfb4"/><path d="M 668 488 H 1168" stroke="#9ab595"/><circle cx="918" cy="488" r="54" fill="none" stroke="#9ab595"/><path d="M 814.8 233 V 283 H 1021.2 V 233 M 814.8 743 V 693 H 1021.2 V 743" fill="none" stroke="#9ab595"/><rect x="730.2" y="281.4" width="66" height="46" rx="11" fill="#fff0f2" stroke="#e6a1b0"/><text x="763.2" y="311.4" font-size="19" fill="#a82e46" text-anchor="middle" font-weight="700">LW</text><rect x="885" y="261" width="66" height="46" rx="11" fill="#fff0f2" stroke="#e6a1b0"/><text x="918" y="291" font-size="19" fill="#a82e46" text-anchor="middle" font-weight="700">ST</text><rect x="1039.8" y="281.4" width="66" height="46" rx="11" fill="#fff0f2" stroke="#e6a1b0"/><text x="1072.8" y="311.4" font-size="19" fill="#a82e46" text-anchor="middle" font-weight="700">RW</text><rect x="678.6" y="429.3" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="711.6" y="459.3" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">LM</text><rect x="812.76" y="429.3" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="845.76" y="459.3" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">CM</text><rect x="957.24" y="429.3" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="990.24" y="459.3" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">CM</text><rect x="1091.4" y="429.3" width="66" height="46" rx="11" fill="#e4f4eb" stroke="#96c6a8"/><text x="1124.4" y="459.3" font-size="19" fill="#236849" text-anchor="middle" font-weight="700">RM</text><rect x="745.6800000000001" y="561.9" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="778.6800000000001" y="591.9" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">LCB</text><rect x="885" y="592.5" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="918" y="622.5" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">CB</text><rect x="1024.32" y="561.9" width="66" height="46" rx="11" fill="#eaf2ff" stroke="#aac1e7"/><text x="1057.32" y="591.9" font-size="19" fill="#295d9c" text-anchor="middle" font-weight="700">RCB</text><rect x="885" y="674.1" width="66" height="46" rx="11" fill="#fff3cd" stroke="#ddbd69"/><text x="918" y="704.1" font-size="19" fill="#865a04" text-anchor="middle" font-weight="700">GK</text><rect x="42" y="809" width="376" height="145" rx="16" fill="#fff" stroke="#cdddcf"/><text x="62" y="848" font-size="23" fill="#28654d" text-anchor="start" font-weight="700">01 · 투표·출석</text><text x="62" y="889" font-size="18" fill="#244438" text-anchor="start" font-weight="400">A / B팀을 고른 뒤 선수 체크</text><text x="62" y="924" font-size="17" fill="#657a6f" text-anchor="start" font-weight="400">참석 예정과 팀을 함께 지정</text><text x="431" y="888" font-size="22" fill="#657a6f" text-anchor="middle" font-weight="400">→</text><rect x="444" y="809" width="376" height="145" rx="16" fill="#e5f1e8" stroke="#cdddcf"/><text x="464" y="848" font-size="23" fill="#28654d" text-anchor="start" font-weight="700">02 · 스쿼드 계획</text><text x="464" y="889" font-size="18" fill="#244438" text-anchor="start" font-weight="400">팀별 후보와 자동 편성</text><text x="464" y="924" font-size="17" fill="#657a6f" text-anchor="start" font-weight="400">드래그·직접 편집도 같은 팀</text><text x="833" y="888" font-size="22" fill="#657a6f" text-anchor="middle" font-weight="400">→</text><rect x="846" y="809" width="376" height="145" rx="16" fill="#fff" stroke="#cdddcf"/><text x="866" y="848" font-size="23" fill="#28654d" text-anchor="start" font-weight="700">03 · 실제 출전</text><text x="866" y="889" font-size="18" fill="#244438" text-anchor="start" font-weight="400">계획 복사 후 실제대로 수정</text><text x="866" y="924" font-size="17" fill="#657a6f" text-anchor="start" font-weight="400">골·도움·교체 기록은 보존</text><rect x="42" y="984" width="1156" height="156" rx="16" fill="#fff" stroke="#cdddcf"/><text x="64" y="1022" font-size="23" fill="#244438" text-anchor="start" font-weight="700">기존 자료를 이어 쓰는 방법</text><text x="64" y="1057" font-size="18" fill="#244438" text-anchor="start" font-weight="400">3-5-2 CDM → CAM  /  3-4-3 LWB·RWB → LM·RM  /  중앙 CB는 표시만 CB</text><text x="64" y="1089" font-size="18" fill="#657a6f" text-anchor="start" font-weight="400">선수·득점·도움·교체는 유지합니다. 예전 계획의 팀이 모호하면 직접 배정합니다.</text><text x="64" y="1120" font-size="18" fill="#657a6f" text-anchor="start" font-weight="400">팀 변경은 확인 후 충돌하는 계획만 해제합니다. 실제 출전 기록은 그대로 둡니다.</text><text x="42" y="1171" font-size="15" fill="#657a6f" text-anchor="start" font-weight="400">설계·그림의 GitHub 반영과 운영 앱 배포는 별도입니다. 실제 회원 정보가 없는 설명용 그림입니다.</text></g></svg>