<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">조축ON 선수 입력과 세부 기록 흐름</title><desc id="desc">로컬 개발 기능. 생년과 등번호 입력, 총 득점 안의 프리킥 및 페널티킥, 연도와 대회 필터, 1~4쿼터당 집계를 설명한다.</desc><rect width="1400" height="1080" fill="#f6f8f3"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="48" y="48" font-size="22" fill="#245f49" font-weight="700">JOCHOOK ON · 조축ON</text><text x="930" y="48" font-size="20" fill="#52675d" font-weight="400">2026.10.15 · 로컬 개발 / 운영 미반영</text><text x="48" y="112" font-size="39" fill="#203e32" font-weight="700">입력은 편하게, 기록은 같은 기준으로</text><text x="48" y="160" font-size="24" fill="#52675d" font-weight="400">팀의 원본 기록을 모아 연도·리그·대회별로 확인해요.</text><rect x="48" y="205" width="625" height="235" rx="18" fill="#fff" stroke="#d4dfd4"/><text x="72" y="249" font-size="27" fill="#245f49" font-weight="700">01  생년 · 등번호 입력</text><text x="72" y="293" font-size="22" fill="#52675d" font-weight="400">직접 입력 + 드롭다운을 함께 사용</text><text x="72" y="328" font-size="22" fill="#52675d" font-weight="400">생년 목록: 1950년 ~ 올해 − 17년</text><text x="72" y="363" font-size="22" fill="#52675d" font-weight="400">등번호: 활동 회원·용병이 쓰지 않는 1~99번</text><text x="72" y="398" font-size="22" fill="#52675d" font-weight="400">여러 명 입력 시 다른 행의 번호도 제외</text><rect x="725" y="205" width="625" height="235" rx="18" fill="#fff" stroke="#d4dfd4"/><text x="749" y="249" font-size="27" fill="#245f49" font-weight="700">02  03단계 세부 득점</text><text x="749" y="293" font-size="22" fill="#52675d" font-weight="400">총 득점 안에 FK·PK를 구분해 입력</text><text x="749" y="328" font-size="22" fill="#52675d" font-weight="400">총 3골 = 다른 골 1 + 직접 FK 1 + PK 1</text><text x="749" y="363" font-size="22" fill="#52675d" font-weight="400">선발·교체 모두 기록 · 승부차기 제외</text><text x="749" y="398" font-size="22" fill="#52675d" font-weight="400">FK + PK가 총 득점보다 클 수 없음</text><rect x="48" y="480" width="625" height="220" rx="18" fill="#eaf1f8" stroke="#d4dfd4"/><text x="72" y="524" font-size="27" fill="#245f49" font-weight="700">03  조회할 기록 선택</text><text x="72" y="568" font-size="22" fill="#52675d" font-weight="400">목록·선수 상세에서 연도와 범위를 선택</text><text x="72" y="603" font-size="22" fill="#52675d" font-weight="400">합산 / 리그만 / 대회만 / 특정 대회</text><text x="72" y="638" font-size="22" fill="#52675d" font-weight="400">리그에는 자체전도 포함</text><text x="72" y="673" font-size="22" fill="#52675d" font-weight="400">기록 완료·용병 포함 조건도 유지</text><rect x="725" y="480" width="625" height="220" rx="18" fill="#edf4e9" stroke="#d4dfd4"/><text x="749" y="524" font-size="27" fill="#245f49" font-weight="700">04  누적과 쿼터당 스탯</text><text x="749" y="568" font-size="22" fill="#52675d" font-weight="400">누적 / 1·2·3·4쿼터당 선택</text><text x="749" y="603" font-size="22" fill="#52675d" font-weight="400">시즌 합계 ÷ 출전 쿼터 × 선택한 쿼터 수</text><text x="749" y="638" font-size="22" fill="#52675d" font-weight="400">교체 출전은 0.5쿼터 · 출전 0은 —</text><text x="749" y="673" font-size="22" fill="#52675d" font-weight="400">경기별 카드는 실제 득점·도움 유지</text><rect x="48" y="742" width="1302" height="170" rx="18" fill="#fff" stroke="#d4dfd4"/><text x="72" y="786" font-size="27" fill="#245f49" font-weight="700">계산 예시 · 2.5쿼터 동안 2골 · 1도움</text><text x="72" y="830" font-size="22" fill="#52675d" font-weight="400">1쿼터당 0.80골 · 0.40도움     →     4쿼터당 3.20골 · 1.60도움</text><text x="72" y="865" font-size="22" fill="#52675d" font-weight="400">4쿼터당은 비교용 환산값이에요. 지금은 프로 90분이나 실제 경기 수로 바꾸지 않아요.</text><text x="48" y="957" font-size="22" fill="#52675d" font-weight="400">출석은 참석·지각한 경기마다 1회. 같은 날 두 경기면 2회이며, 참석 예정 투표는 제외해요.</text><text x="48" y="996" font-size="22" fill="#52675d" font-weight="400">경기별 카드의 프리킥·페널티킥은 득점이 있을 때만 표시해요. 총 골에 다시 더하지 않아요.</text><text x="48" y="1046" font-size="19" fill="#68776c" font-weight="400">운영 앱 b9d8738 · 가이드 1.1 유지  |  docs/player-input-and-stat-details.md</text></g></svg>
