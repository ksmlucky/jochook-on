<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">04 · 변경 이력과 중복 저장 보호</title><desc id="desc">실제 FK가 없어도 이름이 비슷한 ID가 존재합니다. 이력·영수증은 원본 삭제 후에도 남도록 설계했습니다.. V30 스키마 기준 · 2026.10.16 · 로컬 미배포. 실선은 DB 외래키, 점선은 DB 외래키가 없는 논리 참조.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9bb0a4" stroke-width="1.6"/></marker></defs><rect width="1800" height="1900" fill="#f7f8f4"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="52" y="43" font-size="20" fill="#246b51" font-weight="700" text-anchor="start">JOCHOOK ON / 조축ON</text>
<text x="1748" y="43" font-size="19" fill="#5d7168" font-weight="400" text-anchor="end">V30 스키마 기준 · 2026.10.16 · 로컬 미배포</text>
<text x="52" y="99" font-size="38" fill="#203a33" font-weight="700" text-anchor="start">04 · 변경 이력과 중복 저장 보호</text>
<text x="52" y="140" font-size="22" fill="#5d7168" font-weight="400" text-anchor="start">실제 FK가 없어도 이름이 비슷한 ID가 존재합니다. 이력·영수증은 원본 삭제 후에도 남도록 설계했습니다.</text>
<rect x="60" y="190" width="480" height="188" rx="18" fill="#edf4fa" stroke="#cfddd4" stroke-width="1.5"/>
<text x="82" y="223" font-size="23" fill="#246b51" font-weight="700" text-anchor="start" font-family="Consolas, monospace">teams</text>
<text x="82" y="255" font-size="20" fill="#5d7168" font-weight="400" text-anchor="start">서비스 안의 축구팀 · 참조 노드</text>
