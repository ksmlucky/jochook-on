<text x="83" y="1744" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">구간 수 2/4 · 같은 구간 선수 중복 금지 · 선발 0 / 교체 1 · 한 자리에 두 명이면 각각 0.5쿼터</text>
<text x="52" y="1831" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">PK 기본키 · FK 실제 외래키 · UK 유일키 · REF 논리 참조 · 핵심 필드만 표시</text>
<text x="1748" y="1831" font-size="17" fill="#5d7168" font-weight="400" text-anchor="end">실제 회원·경기·계정·비밀값 없음</text>
