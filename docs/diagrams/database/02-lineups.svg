<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1860" viewBox="0 0 1800 1860" role="img" aria-labelledby="title desc"><title id="title">02 · 투표, 계획, 실제 출전</title><desc id="desc">모든 하위 기록은 경기와 연결됩니다. 계획과 실제를 분리해 계획 변경만으로 득점 기록이 바뀌지 않게 합니다.. V29 스키마 기준 · 2026.10.16 · 로컬 미배포. 실선은 DB 외래키, 점선은 DB 외래키가 없는 논리 참조.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9bb0a4" stroke-width="1.6"/></marker></defs><rect width="1800" height="1860" fill="#f7f8f4"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="52" y="43" font-size="20" fill="#246b51" font-weight="700" text-anchor="start">JOCHOOK ON / 조축ON</text>
<text x="1748" y="43" font-size="19" fill="#5d7168" font-weight="400" text-anchor="end">V29 스키마 기준 · 2026.10.16 · 로컬 미배포</text>
<text x="52" y="99" font-size="38" fill="#203a33" font-weight="700" text-anchor="start">02 · 투표, 계획, 실제 출전</text>
<text x="52" y="140" font-size="22" fill="#5d7168" font-weight="400" text-anchor="start">모든 하위 기록은 경기와 연결됩니다. 계획과 실제를 분리해 계획 변경만으로 득점 기록이 바뀌지 않게 합니다.</text>
