<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1840" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc"><title id="title">05 · 골 한 건, 득점 선수, 도움 선수</title><desc id="desc">V31 운영 반영. 구간별 연결 기록에서 출전별 골·도움을 계산하고 기존 시즌 조회에 전달합니다.. V31 운영 반영 · 2026.10.19. 실선은 DB 외래키, 점선은 DB 외래키가 없는 논리 참조.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9bb0a4" stroke-width="1.6"/></marker></defs><rect width="1800" height="1840" fill="#f7f8f4"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="52" y="43" font-size="20" fill="#246b51" font-weight="700" text-anchor="start">JOCHOOK ON / 조축ON</text>
<text x="1748" y="43" font-size="19" fill="#5d7168" font-weight="400" text-anchor="end">V31 운영 반영 · 2026.10.19</text>
<text x="52" y="99" font-size="38" fill="#203a33" font-weight="700" text-anchor="start">05 · 골 한 건, 득점 선수, 도움 선수</text>
<text x="52" y="140" font-size="22" fill="#5d7168" font-weight="400" text-anchor="start">V31 운영 반영. 구간별 연결 기록에서 출전별 골·도움을 계산하고 기존 시즌 조회에 전달합니다.</text>
<rect x="60" y="190" width="700" height="188" rx="18" fill="#edf4fa" stroke="#cfddd4" stroke-width="1.5"/>
<text x="82" y="223" font-size="23" fill="#246b51" font-weight="700" text-anchor="start" font-family="Consolas, monospace">match_records</text>
<text x="82" y="255" font-size="20" fill="#5d7168" font-weight="400" text-anchor="start">경기 한 건의 기본 정보 · 참조 노드</text>
<path d="M 60 272 H 760" stroke="#cfddd4"/>
<text x="80" y="301" font-size="16" fill="#246b51" font-weight="700" text-anchor="start">PK</text>
<text x="154" y="301" font-size="18" fill="#246b51" font-weight="600" text-anchor="start" font-family="Consolas, monospace">id</text>
<text x="154" y="325" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">BIGINT</text>
<text x="82" y="347" font-size="16" fill="#5d7168" font-weight="400" text-anchor="start">같은 테이블을 연결 설명을 위해 다시 표시</text>
<rect x="1040" y="190" width="700" height="188" rx="18" fill="#edf4fa" stroke="#cfddd4" stroke-width="1.5"/>
<text x="1062" y="223" font-size="23" fill="#246b51" font-weight="700" text-anchor="start" font-family="Consolas, monospace">players</text>
<text x="1062" y="255" font-size="20" fill="#5d7168" font-weight="400" text-anchor="start">회원·용병 프로필 · 참조 노드</text>
<path d="M 1040 272 H 1740" stroke="#cfddd4"/>
<text x="1060" y="301" font-size="16" fill="#246b51" font-weight="700" text-anchor="start">PK</text>
<text x="1134" y="301" font-size="18" fill="#246b51" font-weight="600" text-anchor="start" font-family="Consolas, monospace">id</text>
<text x="1134" y="325" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">BIGINT · 등번호와 별개</text>
<text x="1062" y="347" font-size="16" fill="#5d7168" font-weight="400" text-anchor="start">같은 테이블을 연결 설명을 위해 다시 표시</text>
<rect x="430" y="565" width="940" height="514" rx="18" fill="#fff" stroke="#cfddd4" stroke-width="1.5"/>
<text x="452" y="598" font-size="23" fill="#246b51" font-weight="700" text-anchor="start" font-family="Consolas, monospace">match_goal_events</text>
<text x="452" y="630" font-size="20" fill="#5d7168" font-weight="400" text-anchor="start">03 · 골 한 건과 도움 연결</text>
<path d="M 430 647 H 1370" stroke="#cfddd4"/>
<text x="450" y="676" font-size="16" fill="#285d86" font-weight="700" text-anchor="start">PK·FK</text>
<text x="524" y="676" font-size="18" fill="#285d86" font-weight="600" text-anchor="start" font-family="Consolas, monospace">match_id</text>
<text x="524" y="700" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">match_records.id · 경기 삭제 시 CASCADE</text>
<text x="450" y="730" font-size="16" fill="#246b51" font-weight="700" text-anchor="start">PK</text>
<text x="524" y="730" font-size="18" fill="#246b51" font-weight="600" text-anchor="start" font-family="Consolas, monospace">event_order</text>
<text x="524" y="754" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">경기 전체 이벤트 목록 순서 · 0부터</text>
<text x="524" y="784" font-size="18" fill="#203a33" font-weight="400" text-anchor="start" font-family="Consolas, monospace">quarter_number / team</text>
<text x="524" y="808" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">구간 번호 / 득점 팀 A·B</text>
<text x="450" y="838" font-size="16" fill="#285d86" font-weight="700" text-anchor="start">FK</text>
<text x="524" y="838" font-size="18" fill="#285d86" font-weight="600" text-anchor="start" font-family="Consolas, monospace">scorer_id</text>
<text x="524" y="862" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">players.id · 득점 선수</text>
<text x="450" y="892" font-size="16" fill="#285d86" font-weight="700" text-anchor="start">FK</text>
<text x="524" y="892" font-size="18" fill="#285d86" font-weight="600" text-anchor="start" font-family="Consolas, monospace">assist_id</text>
<text x="524" y="916" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">players.id · 도움 선수 · NULL 가능</text>
<text x="524" y="946" font-size="18" fill="#203a33" font-weight="400" text-anchor="start" font-family="Consolas, monospace">goal_type</text>
<text x="524" y="970" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">NORMAL / FREE_KICK / PENALTY</text>
<text x="452" y="992" font-size="16" fill="#5d7168" font-weight="400" text-anchor="start">PK (match_id, event_order) · 분/초를 기록하지 않음</text>
<text x="452" y="1020" font-size="16" fill="#5d7168" font-weight="400" text-anchor="start">자기 도움 금지 · 직접 FK/PK는 도움 없음</text>
<text x="452" y="1048" font-size="16" fill="#5d7168" font-weight="400" text-anchor="start">같은 구간·같은 팀 출전은 서비스에서 검증</text>
<path d="M 410 378 L 410 676 L 430 676" stroke="#246b51" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<text x="235" y="500" font-size="18" fill="#246b51" font-weight="600" text-anchor="middle">경기 1 : 골 0..N</text>
<path d="M 1390 378 L 1390 838 L 1370 838" stroke="#246b51" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<text x="1570" y="715" font-size="18" fill="#246b51" font-weight="600" text-anchor="middle">득점자 1</text>
<path d="M 1510 378 L 1510 892 L 1370 892" stroke="#246b51" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<text x="1570" y="955" font-size="18" fill="#246b51" font-weight="600" text-anchor="middle">도움 선수 0..1</text>
<text x="1530" y="1000" font-size="18" fill="#5d7168" font-weight="400" text-anchor="middle">각 선수 1 : 골 기록 0..N</text>
<rect x="60" y="1190" width="800" height="240" rx="18" fill="#fff" stroke="#cfddd4" stroke-width="1.5"/>
<text x="83" y="1229" font-size="27" fill="#246b51" font-weight="700" text-anchor="start">구간마다 기록 방식을 구분</text>
<text x="83" y="1274" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">match_quarters.goal_events_linked 기본 FALSE</text>
<text x="83" y="1306" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">FALSE: 기존 선수별 합계만 유지 · 연결을 추측하지 않음</text>
<text x="83" y="1338" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">TRUE: 골 목록이 원본 · 빈 목록은 명시적인 0골</text>
<text x="83" y="1370" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">기존 합계와 일치하는 연결 기록을 입력한 뒤 전환</text>
<rect x="940" y="1190" width="800" height="240" rx="18" fill="#fff" stroke="#cfddd4" stroke-width="1.5"/>
<text x="963" y="1229" font-size="27" fill="#246b51" font-weight="700" text-anchor="start">DB 제약과 서비스 검증</text>
<text x="963" y="1274" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">DB: 자기 도움 금지 · 직접 FK/PK에 도움 금지</text>
<text x="963" y="1306" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">서비스: 득점자·도움 선수 같은 구간·같은 팀 출전</text>
<text x="963" y="1338" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">구간·출전 테이블과 복합 FK는 없음</text>
<text x="963" y="1370" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">team은 같은 구간 출전 배치의 A/B팀과 일치</text>
<rect x="60" y="1480" width="1680" height="255" rx="18" fill="#fff" stroke="#cfddd4" stroke-width="1.5"/>
<text x="83" y="1519" font-size="27" fill="#246b51" font-weight="700" text-anchor="start">집계와 기존 자료 보호</text>
<text x="83" y="1564" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">연결 기록 → match_appearances 골·도움·직접 FK·PK 합계 → 기존 선수 시즌 조회</text>
<text x="83" y="1596" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">기록 완료 여부와 기간·리그·대회 필터는 기존 집계 규칙을 유지합니다.</text>
<text x="83" y="1628" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">기존 골·도움을 임의의 선수 조합으로 연결하지 않습니다. 이전 입력 방식의 구간을 그대로 조회할 수 있습니다.</text>
<text x="83" y="1660" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">운영 DB V31 적용과 기존 자료 지문 일치를 확인했습니다. 이 그림에는 실제 자료를 넣지 않았습니다.</text>
<text x="52" y="1811" font-size="17" fill="#5d7168" font-weight="400" text-anchor="start">PK 기본키 · FK 실제 외래키 · UK 유일키 · REF 논리 참조 · 핵심 필드만 표시</text>
<text x="1748" y="1811" font-size="17" fill="#5d7168" font-weight="400" text-anchor="end">실제 회원·경기·계정·비밀값 없음</text>
</g></svg>
