<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title"><title id="title">조축ON 홈과 계정 보호 후속 개선</title><rect width="1200" height="880" fill="#f5f7f3"/><g font-family="Malgun Gothic, sans-serif"><text x="44" y="50" font-size="17" fill="#567268" font-weight="700">JOCHOOK ON  /  RELEASE</text><text x="44" y="102" font-size="36" fill="#264b3d" font-weight="700">기록은 쉽게 찾고, 개인 계정은 안전하게</text><text x="44" y="143" font-size="19" fill="#60766b" font-weight="400">2026.10.16 · 운영 d8b2763 / V30 · 실제 회원 정보 없는 설명용 그림</text><rect x="44" y="182" width="356" height="128" rx="20" fill="#e5f0e8"/><text x="64" y="224" font-size="25" fill="#24634c" font-weight="700">팀 접속</text><text x="64" y="267" font-size="18" fill="#264b3d" font-weight="400">회원 코드 또는 개인 로그인</text><text x="403" y="254" font-size="21" fill="#264b3d" font-weight="400">→</text><rect x="422" y="182" width="356" height="128" rx="20" fill="#e5f0e8"/><text x="442" y="224" font-size="25" fill="#24634c" font-weight="700">우리 팀 홈</text><text x="442" y="267" font-size="18" fill="#264b3d" font-weight="400">최근 경기 · 선수 기록 바로가기</text><text x="781" y="254" font-size="21" fill="#264b3d" font-weight="400">→</text><rect x="800" y="182" width="356" height="128" rx="20" fill="#e5f0e8"/><text x="820" y="224" font-size="25" fill="#24634c" font-weight="700">경기 기록 열기</text><text x="820" y="267" font-size="18" fill="#264b3d" font-weight="400">운영진만 새 기록·이어서 작성</text><rect x="44" y="338" width="548" height="246" rx="20" fill="#fff"/><text x="68" y="380" font-size="26" fill="#264b3d" font-weight="700">개인 계정 변경·복구</text><text x="68" y="425" font-size="21" fill="#264b3d" font-weight="400">현재 비밀번호 확인 또는 관리자 본인 확인</text><text x="68" y="465" font-size="21" fill="#264b3d" font-weight="400">분실 시 30분 · 일회용 링크로 직접 설정</text><text x="68" y="506" font-size="21" fill="#24634c" font-weight="700">기존 로그인 종료 → 새 비밀번호로 접속</text><text x="68" y="548" font-size="18" fill="#60766b" font-weight="400">회원 공유 코드·팀 비밀번호는 그대로</text><rect x="612" y="338" width="544" height="246" rx="20" fill="#fff0da"/><text x="636" y="380" font-size="26" fill="#875821" font-weight="700">자동 백업은 아직 미설정</text><text x="636" y="425" font-size="21" fill="#264b3d" font-weight="400">수동 사본과 자동 일정은 별개</text><text x="636" y="465" font-size="19" fill="#264b3d" font-weight="400">점검 실패를 과거 성공처럼 남기던 문제 수정</text><text x="636" y="506" font-size="20" fill="#875821" font-weight="700">다음: 무료 허용 주기 · 독립 사본 · 복원</text><text x="636" y="548" font-size="18" fill="#60766b" font-weight="400">클라우드 자원·권한·요금 변경 없음</text><rect x="44" y="612" width="1112" height="161" rx="20" fill="#fff"/><text x="68" y="653" font-size="24" fill="#264b3d" font-weight="700">구현한 것과 결정이 필요한 것을 구분해요</text><text x="68" y="695" font-size="20" fill="#264b3d" font-weight="400">운영 반영   홈 · 비밀번호 변경/복구 · 모바일 기록·필터 개선 · V30 ERD</text><text x="68" y="735" font-size="20" fill="#875821" font-weight="400">남은 과제   자동 백업 주기·독립 사본 · 서비스 관리자 계정의 별도 복구</text><text x="44" y="821" font-size="19" fill="#60766b" font-weight="400">운영 d8b2763 / V30  |  역할별 사용 가이드 1.3와 함께 반영</text><text x="44" y="854" font-size="16" fill="#60766b" font-weight="400">이 그림의 원본은 scripts/Generate-HomeAccountReview.mjs 입니다.</text></g></svg>