<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">조축ON 경기 초안 복원과 저장 재시도</title><desc id="desc">로컬 구현. 같은 탭의 계정과 팀별 임시 초안, UUID 저장 요청, 서버의 완료 영수증 확인 및 동일 요청 재시도. 운영 미반영.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5c806e" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" fill="#f7f8f4"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="43" fill="#28654d" font-size="20" font-weight="700">JOCHOOK ON / 조축ON</text><text x="840" y="43" fill="#68786f" font-size="19" font-weight="400">로컬 구현 · 운영 미반영</text><text x="40" y="94" fill="#263e33" font-size="34" font-weight="700">입력은 이어서, 같은 저장 요청은 한 번만</text><text x="40" y="127" fill="#52695d" font-size="19" font-weight="400">임시 초안 보관과 서버 저장을 구분합니다. 계정·팀·수정 버전은 기존 권한 경계를 유지합니다.</text><rect x="40" y="165" width="340" height="140" rx="16" fill="#fff" stroke="#bacfc0"/><text x="60" y="198" fill="#28654d" font-size="23" font-weight="700">01 입력 중 임시 보관</text><text x="60" y="232" fill="#52695d" font-size="17" font-weight="400">같은 탭 · 계정 + 팀별 1개</text><text x="60" y="259" fill="#52695d" font-size="17" font-weight="400">최대 24시간 · 직접 로그아웃 시 삭제</text><text x="60" y="286" fill="#52695d" font-size="17" font-weight="400">비밀번호·팀 코드·인증 토큰 제외</text><rect x="430" y="165" width="340" height="140" rx="16" fill="#fff" stroke="#bacfc0"/><text x="450" y="198" fill="#28654d" font-size="23" font-weight="700">02 복원 여부 선택</text><text x="450" y="232" fill="#52695d" font-size="17" font-weight="400">새로고침 / 세션 만료 뒤 재접속</text><text x="450" y="259" fill="#52695d" font-size="17" font-weight="400">서버 version 일치 → 이어서 입력</text><text x="450" y="286" fill="#52695d" font-size="17" font-weight="400">불일치 → 초안 보존 · 덮어쓰기 차단</text><rect x="820" y="165" width="340" height="140" rx="16" fill="#fff" stroke="#bacfc0"/><text x="840" y="198" fill="#28654d" font-size="23" font-weight="700">03 단계별 저장</text><text x="840" y="232" fill="#52695d" font-size="17" font-weight="400">UUID + 정확한 요청 사본 보관</text><text x="840" y="259" fill="#52695d" font-size="17" font-weight="400">POST/PUT에 같은 요청 번호 전달</text><text x="840" y="286" fill="#52695d" font-size="17" font-weight="400">CSRF · 운영진 권한 · 팀 범위 확인</text><path d="M380 235 L425 235" stroke="#5c806e" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M770 235 L815 235" stroke="#5c806e" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M990 305 L990 390" stroke="#5c806e" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="820" y="395" width="340" height="140" rx="16" fill="#e8f3eb" stroke="#bacfc0"/><text x="840" y="428" fill="#28654d" font-size="23" font-weight="700">04 서버에서 한 번만</text><text x="840" y="462" fill="#52695d" font-size="17" font-weight="400">팀 + 계정 + UUID 고유 키</text><text x="840" y="489" fill="#52695d" font-size="17" font-weight="400">경기 · 변경 이력 · 영수증 함께 저장</text><text x="840" y="516" fill="#52695d" font-size="17" font-weight="400">실패 시 전체 롤백</text><rect x="430" y="395" width="340" height="140" rx="16" fill="#fff" stroke="#bacfc0"/><text x="450" y="428" fill="#28654d" font-size="23" font-weight="700">05 응답을 못 받았다면</text><text x="450" y="462" fill="#52695d" font-size="17" font-weight="400">완료 영수증과 현재 기록부터 확인</text><text x="450" y="489" fill="#52695d" font-size="17" font-weight="400">미완료 → 같은 UUID·내용 재전송</text><text x="450" y="516" fill="#52695d" font-size="17" font-weight="400">내용 변경 / 후속 수정·삭제는 차단</text><rect x="40" y="395" width="340" height="140" rx="16" fill="#fff" stroke="#bacfc0"/><text x="60" y="428" fill="#28654d" font-size="23" font-weight="700">06 결과 확인 후 계속</text><text x="60" y="462" fill="#52695d" font-size="17" font-weight="400">성공 → 초안 정리 · 다음 단계</text><text x="60" y="489" fill="#52695d" font-size="17" font-weight="400">미확인 → 초안 보관 · 입력 잠금</text><text x="60" y="516" fill="#52695d" font-size="17" font-weight="400">충돌 → 최신 기록 조회 / 명시 폐기</text><path d="M820 465 L775 465" stroke="#5c806e" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M430 465 L385 465" stroke="#5c806e" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="603" fill="#28654d" font-size="23" font-weight="700">보관 위치</text><text x="40" y="639" fill="#263e33" font-size="19" font-weight="400">브라우저 sessionStorage: 현재 초안 · 원래 version · 미확인 저장 요청</text><text x="40" y="672" fill="#263e33" font-size="19" font-weight="400">MySQL match_save_requests (V23): 요청 지문 · 결과 경기 ID/version · 시각</text><text x="40" y="720" fill="#68786f" font-size="18" font-weight="400">실제 회원 자료를 넣지 않은 설명 그림입니다. 문서 공개와 운영 배포는 별도입니다.</text></g></svg>