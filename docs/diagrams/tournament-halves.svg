<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">조축ON 대회 두 구간과 자체전 팀 선택</title><desc id="desc">외부 경기는 대회 연결과 관계없이 전반과 후반 30분씩 각 1쿼터로 기록할 수 있다. 자체전은 A B 팀을 먼저 선택하고 선수를 체크한다. 기존 기록은 보존한다.</desc><rect width="1200" height="1110" fill="#f5f8f3"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="43" fill="#28654d" font-size="19" font-weight="700">JOCHOOK ON / 조축ON</text><text x="750" y="43" fill="#657a6f" font-size="18" font-weight="400">2026.10.19 · 경기 입력 개선</text><text x="40" y="100" fill="#244438" font-size="36" font-weight="700">외부 경기는 형식 선택, 자체전은 팀 선택부터</text><text x="40" y="141" fill="#657a6f" font-size="21" font-weight="400">참석 → 스쿼드·기록 → 결과의 3단계로, 경기 형식에 맞게 작전판과 기록을 연결합니다.</text><rect x="40" y="174" width="1120" height="254" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="216" fill="#28654d" font-size="26" font-weight="700">외부 경기: 대회 연결 없이도 전·후반 선택 가능</text><rect x="64" y="244" width="510" height="151" rx="18" fill="#eef5e9" stroke="#ceddce"/><rect x="598" y="244" width="538" height="151" rx="18" fill="#eef5e9" stroke="#ceddce"/><text x="89" y="281" fill="#28654d" font-size="25" font-weight="700">전반 · 1쿼터</text><text x="89" y="319" fill="#244438" font-size="23" font-weight="400">30분 / 전체 출전 = 1쿼터</text><text x="89" y="361" fill="#657a6f" font-size="19" font-weight="400">같은 자리에서 교체하면 두 선수 각각 0.5</text><text x="623" y="281" fill="#28654d" font-size="25" font-weight="700">후반 · 2쿼터</text><text x="623" y="319" fill="#244438" font-size="23" font-weight="400">30분 / 전체 출전 = 1쿼터</text><text x="623" y="361" fill="#657a6f" font-size="19" font-weight="400">풀타임 합계 2쿼터 · 휴식 시간은 별도</text><rect x="40" y="455" width="364" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="58" y="497" fill="#28654d" font-size="22" font-weight="700">01 · 참석 명단</text><text x="58" y="538" fill="#244438" font-size="19" font-weight="400">선택하면 참석 반영</text><rect x="418" y="455" width="364" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="436" y="497" fill="#28654d" font-size="22" font-weight="700">02 · 스쿼드·기록</text><text x="436" y="538" fill="#244438" font-size="19" font-weight="400">선발·교체 배치</text><rect x="796" y="455" width="364" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="814" y="497" fill="#28654d" font-size="22" font-weight="700">03 · 결과·코멘트</text><text x="814" y="538" fill="#244438" font-size="19" font-weight="400">골·도움 입력 후 완료</text><rect x="40" y="598" width="1120" height="187" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="639" fill="#28654d" font-size="26" font-weight="700">자체전 01 · A/B팀별 선수 체크</text><text x="64" y="680" fill="#244438" font-size="24" font-weight="400">A팀 선택 → 선수 체크 → B팀 선택 → 선수 체크</text><text x="64" y="720" fill="#657a6f" font-size="20" font-weight="400">체크로 참석과 팀을 지정합니다. 단계별 저장 버튼을 눌러야 DB에 저장됩니다.</text><text x="64" y="755" fill="#657a6f" font-size="20" font-weight="400">02에서 같은 팀 안에서 편성합니다. 03에서 구간별 골·도움과 결과를 입력합니다.</text><rect x="40" y="815" width="1120" height="232" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="857" fill="#244438" font-size="26" font-weight="700">기존 자료와 집계 기준</text><text x="64" y="900" fill="#244438" font-size="20" font-weight="400">기존 4쿼터 대회는 자동으로 줄이지 않습니다. 3·4쿼터 기록이 있으면 전환을 막습니다.</text><text x="64" y="940" fill="#244438" font-size="20" font-weight="400">리그 + 대회 = 기록한 쿼터 수를 합산합니다. 분 단위 환산이나 90분 보정은 없습니다.</text><text x="64" y="980" fill="#244438" font-size="20" font-weight="400">기본 4쿼터 일정은 시작 +2시간, 전·후반 일정은 시작 +60분으로 표시합니다.</text><text x="64" y="1019" fill="#657a6f" font-size="19" font-weight="400">대회가 없으면 경기 작성 중 + 대회 등록 → 초안 유지 → 경기 저장으로 연결합니다.</text><text x="40" y="1084" fill="#657a6f" font-size="17" font-weight="400">2026.10.19 경기 입력 개선 · 가이드 1.11 · 배포 상태는 기능 문서 참조 · 실제 회원 정보 없음</text></g></svg>