<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">조축ON 대회 두 구간과 자체전 팀 선택</title><desc id="desc">운영 배포 전 개발 기능. 대회는 전반과 후반 30분씩 각 1쿼터로 집계한다. 자체전은 A B 팀을 먼저 선택하고 선수를 체크한다. 기존 기록은 보존한다.</desc><rect width="1200" height="1110" fill="#f5f8f3"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="43" fill="#28654d" font-size="19" font-weight="700">JOCHOOK ON / 조축ON</text><text x="750" y="43" fill="#657a6f" font-size="18" font-weight="400">2026.10.15 · 운영 배포 확인</text><text x="40" y="100" fill="#244438" font-size="36" font-weight="700">대회는 두 구간, 자체전은 팀 선택부터</text><text x="40" y="141" fill="#657a6f" font-size="21" font-weight="400">입력 단계는 01~04 그대로, 경기 형식에 맞게 작전판과 기록을 연결합니다.</text><rect x="40" y="174" width="1120" height="254" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="216" fill="#28654d" font-size="26" font-weight="700">새 대회 경기</text><rect x="64" y="244" width="510" height="151" rx="18" fill="#eef5e9" stroke="#ceddce"/><rect x="598" y="244" width="538" height="151" rx="18" fill="#eef5e9" stroke="#ceddce"/><text x="89" y="281" fill="#28654d" font-size="25" font-weight="700">전반 · 1쿼터</text><text x="89" y="319" fill="#244438" font-size="23" font-weight="400">30분 / 전체 출전 = 1쿼터</text><text x="89" y="361" fill="#657a6f" font-size="19" font-weight="400">같은 자리에서 교체하면 두 선수 각각 0.5</text><text x="623" y="281" fill="#28654d" font-size="25" font-weight="700">후반 · 2쿼터</text><text x="623" y="319" fill="#244438" font-size="23" font-weight="400">30분 / 전체 출전 = 1쿼터</text><text x="623" y="361" fill="#657a6f" font-size="19" font-weight="400">풀타임 합계 2쿼터 · 휴식 시간은 별도</text><rect x="40" y="455" width="268" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="58" y="497" fill="#28654d" font-size="22" font-weight="700">01 · 투표·출석</text><text x="58" y="538" fill="#244438" font-size="19" font-weight="400">참석 명단 확인</text><rect x="324" y="455" width="268" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="342" y="497" fill="#28654d" font-size="22" font-weight="700">02 · 스쿼드 계획</text><text x="342" y="538" fill="#244438" font-size="19" font-weight="400">전반·후반 편성</text><rect x="608" y="455" width="268" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="626" y="497" fill="#28654d" font-size="22" font-weight="700">03 · 실제 출전</text><text x="626" y="538" fill="#244438" font-size="19" font-weight="400">교체·골·도움</text><rect x="892" y="455" width="268" height="115" rx="18" fill="#fff" stroke="#ceddce"/><text x="910" y="497" fill="#28654d" font-size="22" font-weight="700">04 · 결과·코멘트</text><text x="910" y="538" fill="#244438" font-size="19" font-weight="400">점검 후 기록 완료</text><rect x="40" y="598" width="1120" height="187" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="639" fill="#28654d" font-size="26" font-weight="700">자체전 01 · A/B팀별 선수 체크</text><text x="64" y="680" fill="#244438" font-size="24" font-weight="400">A팀 선택 → 선수 체크 → B팀 선택 → 선수 체크</text><text x="64" y="720" fill="#657a6f" font-size="20" font-weight="400">체크로 참석 예정과 팀을 지정합니다. 단계별 저장 버튼을 눌러야 DB에 저장됩니다.</text><text x="64" y="755" fill="#657a6f" font-size="20" font-weight="400">02에서는 정한 팀 안에서 4쿼터를 편성합니다. 03 실제 기록은 그대로 보존합니다.</text><rect x="40" y="815" width="1120" height="232" rx="18" fill="#fff" stroke="#ceddce"/><text x="64" y="857" fill="#244438" font-size="26" font-weight="700">기존 자료와 집계 기준</text><text x="64" y="900" fill="#244438" font-size="20" font-weight="400">기존 4쿼터 대회는 자동으로 줄이지 않습니다. 3·4쿼터 기록이 있으면 전환을 막습니다.</text><text x="64" y="940" fill="#244438" font-size="20" font-weight="400">리그 + 대회 = 기록한 쿼터 수를 합산합니다. 분 단위 환산이나 90분 보정은 없습니다.</text><text x="64" y="980" fill="#244438" font-size="20" font-weight="400">기본 4쿼터 일정은 시작 +2시간, 전·후반 일정은 시작 +60분으로 표시합니다.</text><text x="64" y="1019" fill="#657a6f" font-size="19" font-weight="400">문서·그림의 GitHub 반영과 실제 앱 배포는 별도입니다.</text><text x="40" y="1084" fill="#657a6f" font-size="17" font-weight="400">2026.10.15 대회·기록 확장판 · V28 / 가이드 1.2 · 실제 회원 정보 없음</text></g></svg>