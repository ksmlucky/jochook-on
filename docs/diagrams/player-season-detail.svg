<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">조축ON 선수별 시즌 상세 조회 흐름</title><desc id="desc">로컬 개발 기능. 시즌 목록에서 선수를 선택하고 경기별 기여 기록과 원본을 조회한다. 현재 운영 버전 b9d8738과 구분한다.</desc><rect width="1440" height="980" fill="#f6f8f3"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="55" y="50" font-size="22" fill="#245f49" font-weight="700">JOCHOOK ON · 조축ON</text><text x="935" y="50" font-size="20" fill="#6b776c" font-weight="400">2026.10.15 · 로컬 개발 / 운영 미반영</text><text x="55" y="114" font-size="38" fill="#203e32" font-weight="700">이 기록은 어느 경기에서 나왔을까?</text><text x="55" y="160" font-size="23" fill="#274e40" font-weight="400">선수 합계 → 경기별 기록 → 원본 경기. 선택한 집계 범위를 유지하며 확인해요.</text><rect x="55" y="210" width="410" height="335" rx="20" fill="#fff" stroke="#d3e1d7"/><text x="79" y="252" font-size="25" fill="#245f49" font-weight="700">01  시즌 목록</text><text x="79" y="296" font-size="20" fill="#52675d" font-weight="400">시작 연월 ~ 종료 연월 → 조회</text><text x="79" y="330" font-size="20" fill="#52675d" font-weight="400">올해 기본 · 전체 기간 바로 조회</text><text x="79" y="364" font-size="20" fill="#52675d" font-weight="400">매칭·자체전 횟수와 누적 득점</text><text x="79" y="398" font-size="20" fill="#52675d" font-weight="400">누적 실점은 매칭만 집계</text><text x="79" y="432" font-size="20" fill="#52675d" font-weight="400">열 제목으로 양방향 정렬</text><text x="79" y="466" font-size="20" fill="#52675d" font-weight="400">선수 이름이나 등번호 → 상세</text><rect x="515" y="210" width="410" height="335" rx="20" fill="#fff" stroke="#d3e1d7"/><text x="539" y="252" font-size="25" fill="#245f49" font-weight="700">02  선수별 상세</text><text x="539" y="296" font-size="20" fill="#52675d" font-weight="400">기간 범위와 리그·대회 선택</text><text x="539" y="330" font-size="20" fill="#52675d" font-weight="400">상단: 누적 / 1~4쿼터당 선택</text><text x="539" y="364" font-size="20" fill="#52675d" font-weight="400">경기 카드: 실제 득점·도움</text><text x="539" y="398" font-size="20" fill="#52675d" font-weight="400"></text><text x="539" y="432" font-size="20" fill="#52675d" font-weight="400">10.10  예시 팀전  ·  2골 / 1도움</text><text x="539" y="466" font-size="20" fill="#52675d" font-weight="400">카드에서 원본 경기 보기</text><rect x="975" y="210" width="410" height="335" rx="20" fill="#fff" stroke="#d3e1d7"/><text x="999" y="252" font-size="25" fill="#245f49" font-weight="700">03  원본 경기 조회</text><text x="999" y="296" font-size="20" fill="#52675d" font-weight="400">01  투표와 실제 출석</text><text x="999" y="330" font-size="20" fill="#52675d" font-weight="400">02  계획 스쿼드</text><text x="999" y="364" font-size="20" fill="#52675d" font-weight="400">03  실제 출전·골·도움</text><text x="999" y="398" font-size="20" fill="#52675d" font-weight="400">04  스코어와 코멘트</text><text x="999" y="432" font-size="20" fill="#52675d" font-weight="400"></text><text x="999" y="466" font-size="20" fill="#52675d" font-weight="400">이 경로에서는 읽기만 가능해요.</text><text x="478" y="381" font-size="32" fill="#274e40" font-weight="400">→</text><text x="938" y="381" font-size="32" fill="#274e40" font-weight="400">→</text><rect x="55" y="585" width="640" height="154" rx="20" fill="#eaf3e8" stroke="#d3e1d7"/><text x="79" y="627" font-size="25" fill="#245f49" font-weight="700">돌아가도 선택은 그대로</text><text x="79" y="671" font-size="20" fill="#52675d" font-weight="400">상세 → 목록 : 필터·검색·정렬 유지</text><text x="79" y="705" font-size="20" fill="#52675d" font-weight="400">원본 → 상세 : 선택 선수·페이지와 포커스 복귀</text><rect x="725" y="585" width="660" height="154" rx="20" fill="#eaf1f8" stroke="#d3e1d7"/><text x="749" y="627" font-size="25" fill="#245f49" font-weight="700">집계와 상세는 같은 기준</text><text x="749" y="671" font-size="20" fill="#52675d" font-weight="400">실제 참석 또는 출전한 경기만 포함</text><text x="749" y="705" font-size="20" fill="#52675d" font-weight="400">교체 0.5Q · 자체전 이동도 출전 경기 한 번</text><rect x="55" y="778" width="1330" height="135" rx="20" fill="#fff" stroke="#d3e1d7"/><text x="79" y="820" font-size="25" fill="#245f49" font-weight="700">운영 자료 보호와 배포 기준</text><text x="79" y="864" font-size="20" fill="#52675d" font-weight="400">DB 구조 변경 없이 조회 기능 추가 · 실제 자료 대신 가상 데이터로 검증</text><text x="79" y="898" font-size="20" fill="#52675d" font-weight="400">운영 앱·공유용 가이드는 b9d8738 / 1.1 유지. 새 기능 배포 때 가이드도 함께 갱신.</text><text x="55" y="950" font-size="18" fill="#65786a" font-weight="400">기획·화면·API 명세: docs/player-season-detail.md  |  실제 회원 정보 없는 설명 그림</text></g></svg>