<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">업무 흐름도 · 한 경기를 어떻게 남길까?</title><desc id="desc">회원은 조회하고, 감독·코치는 선수와 경기 기록을 관리합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8b9e96" stroke-width="1.6"/></marker></defs><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="1400" height="940" fill="#f7f8f4"/>
<text x="54" y="43" font-size="19" fill="#246b51" font-weight="600" text-anchor="start">JOCHOOK ON  /  조축ON</text>
<text x="1346" y="43" font-size="17" fill="#566d65" font-weight="400" text-anchor="end">02 / 4   ·   2026.10.19</text>
<text x="54" y="97" font-size="36" fill="#203a33" font-weight="700" text-anchor="start">업무 흐름도 · 한 경기를 어떻게 남길까?</text>
<text x="54" y="130" font-size="20" fill="#566d65" font-weight="400" text-anchor="start">회원은 조회하고, 감독·코치는 선수와 경기 기록을 관리합니다.</text>
<rect x="54" y="166" width="397" height="143" rx="18" fill="#edf4fa" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="54" y="186" width="5" height="103" rx="2" fill="#285d86"/>
<text x="78" y="205" font-size="25" fill="#285d86" font-weight="600" text-anchor="start">서비스 관리자</text>
<text x="78" y="245" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">팀 생성 · 감독 지정 · 운영진 복구</text>
<text x="78" y="276" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">본인 확인 후 30분·일회용 링크</text>
<rect x="501" y="166" width="397" height="143" rx="18" fill="#e7f3eb" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="501" y="186" width="5" height="103" rx="2" fill="#246b51"/>
<text x="525" y="205" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">감독 · 코치</text>
<text x="525" y="245" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">개인 계정 로그인 · 기록 입력/수정</text>
<text x="525" y="276" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">감독이 코치 임명 · 팀 접속 정보 발급</text>
<rect x="948" y="166" width="397" height="143" rx="18" fill="#ffffff" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="948" y="186" width="5" height="103" rx="2" fill="#246b51"/>
<text x="972" y="205" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">회원</text>
<text x="972" y="245" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">팀 코드 + 팀 비밀번호로 조회</text>
<text x="972" y="276" font-size="21" fill="#203a33" font-weight="400" text-anchor="start">선수 · 경기 · 스쿼드 · 시즌 기록</text>
<path d="M 452 240 L 498 240" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 899 240 L 945 240" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="54" y="342" font-size="21" fill="#246b51" font-weight="600" text-anchor="start">팀 접속 → 우리 팀 홈 → 최근 경기·선수 기록 / 운영진은 새 기록·이어서 작성</text>
<rect x="54" y="367" width="402" height="240" rx="18" fill="#ffffff" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="54" y="387" width="5" height="200" rx="2" fill="#246b51"/>
<text x="78" y="406" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">01 · 참석 명단</text>
<text x="78" y="446" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">날짜·시각 · 리그/대회 선택</text>
<text x="78" y="477" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">전·후반 또는 4쿼터 선택</text>
<text x="78" y="508" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">선택하면 참석도 함께 반영</text>
<text x="78" y="539" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">자체전 A·B팀 먼저 체크</text>
<path d="M 457 485 L 495 485" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 255 608 L 255 646" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="498" y="367" width="402" height="240" rx="18" fill="#ffffff" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="498" y="387" width="5" height="200" rx="2" fill="#246b51"/>
<text x="522" y="406" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">02 · 스쿼드·기록</text>
<text x="522" y="446" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">자동 편성 / 자리 눌러 배치</text>
<text x="522" y="477" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">탭하여 선택 / 길게 눌러 이동</text>
<text x="522" y="508" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">목록 / 다음으로 저장</text>
<text x="522" y="539" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">교체 1쌍은 각 0.5쿼터</text>
<path d="M 901 485 L 939 485" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 699 608 L 699 646" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="942" y="367" width="402" height="240" rx="18" fill="#ffffff" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="942" y="387" width="5" height="200" rx="2" fill="#246b51"/>
<text x="966" y="406" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">03 · 결과·코멘트</text>
<text x="966" y="446" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">쿼터별 골·도움 입력·저장</text>
<text x="966" y="477" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">쿼터 실점 / 스코어 자동 합산</text>
<text x="966" y="508" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">완료 버튼으로 확정</text>
<text x="966" y="539" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">완료된 경기만 기본 통계</text>
<path d="M 1143 608 L 1143 646" fill="none" stroke="#8b9e96" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="54" y="649" width="1291" height="73" rx="18" fill="#e7f3eb" stroke="#c9dfd0" stroke-width="1.5"/>
<text x="699" y="681" font-size="24" fill="#203a33" font-weight="600" text-anchor="middle">단계별 저장 → 경기 DB + 변경 이력 + 저장 영수증 → 목록에 작성 상태 표시</text>
<text x="699" y="707" font-size="18" fill="#566d65" font-weight="400" text-anchor="middle">올해 기본 · 전체 기간 / 연월 범위 · 리그+대회 합산 · 자체전 포함 · 완료 후에도 수정 가능</text>
<rect x="54" y="756" width="625" height="116" rx="18" fill="#edf4fa" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="54" y="776" width="5" height="76" rx="2" fill="#285d86"/>
<text x="78" y="795" font-size="25" fill="#285d86" font-weight="600" text-anchor="start">입력 보호 · 저장 영수증</text>
<text x="78" y="835" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">같은 탭 24시간 초안 · 동일 요청 중복 저장 방지</text>
<text x="78" y="866" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">서버 저장은 단계별 버튼 · 충돌 시 덮어쓰기 차단</text>
<rect x="714" y="756" width="631" height="116" rx="18" fill="#ffffff" stroke="#d8e3dc" stroke-width="1.5"/>
<rect x="714" y="776" width="5" height="76" rx="2" fill="#246b51"/>
<text x="738" y="795" font-size="25" fill="#246b51" font-weight="600" text-anchor="start">조회 메뉴 · 역할별 가이드</text>
<text x="738" y="835" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">홈 / 선수단 / 경기 / 선수 기록 / 대회 / 가이드</text>
<text x="738" y="866" font-size="20" fill="#203a33" font-weight="400" text-anchor="start">운영진·회원별 앱 가이드 / 공유 PDF 1.12</text>
<text x="54" y="918" font-size="16" fill="#566d65" font-weight="400" text-anchor="start">2026.10.19 작전판 드래그·쿼터 실점 · 웹/API 1519c9d · 배포 확인은 문서 참조 · DB V32</text>
<text x="1346" y="918" font-size="16" fill="#566d65" font-weight="400" text-anchor="end">실제 회원 정보·접속 비밀값 제외</text>
</g></svg>