<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300" role="img" aria-labelledby="title desc"><title id="title">조축ON 대회 관리와 경기 완료 전 점검 흐름</title><desc id="desc">로컬 구현이며 운영 미반영. 감독과 코치는 대회 등록, 경기 연결, 기존 4쿼터 기록, 완료 전 점검과 명시적 완료를 진행한다. 회원은 대회 및 경기와 선수 기록을 조회한다. 실제 대회 날짜나 회원 정보는 포함하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6d8f7e" stroke-width="1.6"/></marker></defs><rect width="1500" height="1300" fill="#f6f8f3"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="55" y="48" font-size="22" fill="#245f49" font-weight="700">JOCHOOK ON · 조축ON</text><text x="987" y="48" font-size="21" fill="#68776c" font-weight="400">2026.10.15 · 로컬 구현 / 운영 미반영</text><text x="55" y="114" font-size="39" fill="#203e32" font-weight="700">대회를 만들고, 경기와 선수 기록을 함께 모아요</text><text x="55" y="162" font-size="23" fill="#365b49" font-weight="400">감독·코치는 등록과 수정, 회원은 조회. 경기 입력은 기존 4쿼터 흐름을 유지해요.</text><rect x="55" y="212" width="430" height="232" rx="20" fill="#fff" stroke="#cfded3"/><text x="79" y="255" font-size="26" fill="#245f49" font-weight="700">01  연도별 대회 등록</text><text x="79" y="296" font-size="21" fill="#52675d" font-weight="400">필수: 대회 이름 · 시작일 · 종료일</text><text x="79" y="328" font-size="21" fill="#52675d" font-weight="400">선택: 장소 · 참가 부문 · 메모</text><text x="79" y="360" font-size="21" fill="#52675d" font-weight="400">한 대회에 여러 경기 연결</text><text x="79" y="392" font-size="21" fill="#52675d" font-weight="400">봄·가을·K7도 참가 연도별 등록</text><rect x="535" y="212" width="430" height="232" rx="20" fill="#fff" stroke="#cfded3"/><text x="559" y="255" font-size="26" fill="#245f49" font-weight="700">02  리그 / 대회 구분</text><text x="559" y="296" font-size="21" fill="#52675d" font-weight="400">매주 정기 경기는 리그로 표시</text><text x="559" y="328" font-size="21" fill="#52675d" font-weight="400">등록한 대회를 선택하면 대회</text><text x="559" y="360" font-size="21" fill="#52675d" font-weight="400">예선·결승 등 단계는 선택 입력</text><text x="559" y="392" font-size="21" fill="#52675d" font-weight="400">자체전은 별도로 유지</text><rect x="1015" y="212" width="430" height="232" rx="20" fill="#fff" stroke="#cfded3"/><text x="1039" y="255" font-size="26" fill="#245f49" font-weight="700">03  기존 방식으로 경기 입력</text><text x="1039" y="296" font-size="21" fill="#52675d" font-weight="400">01 투표·실제 출석</text><text x="1039" y="328" font-size="21" fill="#52675d" font-weight="400">02 계획 스쿼드 → 03 실제 출전</text><text x="1039" y="360" font-size="21" fill="#52675d" font-weight="400">04 스코어·코멘트</text><text x="1039" y="392" font-size="21" fill="#52675d" font-weight="400">대회 경기는 외부 경기로 기록</text><path d="M491 326 L526 326" stroke="#6d8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M971 326 L1006 326" stroke="#6d8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1230 451 L1230 490" stroke="#6d8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="500" width="1390" height="252" rx="20" fill="#eef4e8" stroke="#cfded3"/><text x="79" y="547" font-size="28" fill="#245f49" font-weight="700">04  완료 전 점검</text><text x="79" y="584" font-size="22" fill="#52675d" font-weight="400">안내를 보고 해당 단계·쿼터로 이동해 확인해요. 창을 여는 것만으로 저장하지 않아요.</text><text x="79" y="632" font-size="23" fill="#245f49" font-weight="700">투표와 실제 출석</text><text x="79" y="667" font-size="20" fill="#52675d" font-weight="400">참석 예정인데 실제 출석 미확인</text><text x="79" y="699" font-size="20" fill="#52675d" font-weight="400">참석·지각했지만 출전 기록 없음</text><text x="555" y="632" font-size="23" fill="#245f49" font-weight="700">쿼터별 선발 배치</text><text x="555" y="667" font-size="20" fill="#52675d" font-weight="400">팀·쿼터별 빈 자리와 선발 수</text><text x="555" y="699" font-size="20" fill="#52675d" font-weight="400">교체는 선발 수에 중복 집계 안 함</text><text x="1025" y="632" font-size="23" fill="#245f49" font-weight="700">스코어와 득점 기록</text><text x="1025" y="667" font-size="20" fill="#52675d" font-weight="400">최종 스코어 미입력</text><text x="1025" y="699" font-size="20" fill="#52675d" font-weight="400">선수별 골 합계와 스코어 차이</text><path d="M380 759 L380 794" stroke="#6d8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="804" width="650" height="226" rx="20" fill="#fff" stroke="#cfded3"/><text x="79" y="847" font-size="26" fill="#245f49" font-weight="700">05  운영진이 기록 완료</text><text x="79" y="888" font-size="21" fill="#52675d" font-weight="400">확인 후 기록 완료 · 목록으로</text><text x="79" y="920" font-size="21" fill="#52675d" font-weight="400">안내가 남아도 자동으로 완료를 막지 않음</text><text x="79" y="952" font-size="21" fill="#52675d" font-weight="400">필수값·중복 배치 등 기존 저장 검증은 유지</text><text x="79" y="984" font-size="21" fill="#52675d" font-weight="400">단계별 중간 저장도 계속 사용</text><rect x="785" y="804" width="660" height="226" rx="20" fill="#eaf1f8" stroke="#cfded3"/><text x="809" y="847" font-size="26" fill="#245f49" font-weight="700">06  범위를 골라 합산 조회</text><text x="809" y="888" font-size="21" fill="#52675d" font-weight="400">리그 + 대회 합산 / 리그만 / 대회만</text><text x="809" y="920" font-size="21" fill="#52675d" font-weight="400">특정 대회도 선택 · 같은 시즌과 완료 기준</text><text x="809" y="952" font-size="21" fill="#52675d" font-weight="400">선수별 상세 → 원본 경기로 기록 대조</text><text x="809" y="984" font-size="21" fill="#52675d" font-weight="400">기존 집계 기준과 0.5쿼터 교체 계산 유지</text><path d="M713 918 L776 918" stroke="#6d8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="1070" width="1390" height="150" rx="20" fill="#fff" stroke="#cfded3"/><text x="79" y="1112" font-size="25" fill="#245f49" font-weight="700">이번 범위와 후속 작업을 구분해요</text><text x="79" y="1150" font-size="21" fill="#52675d" font-weight="400">대회 기간 밖 경기 날짜는 안내만 해요. 전·후반, 경기 길이, 승부차기, 연령 자격 판정은 후속 설계예요.</text><text x="79" y="1185" font-size="21" fill="#52675d" font-weight="400">운영 앱 b9d8738 · 가이드 1.1 유지. 다음 기능 배포를 준비할 때 회원·운영진 가이드를 함께 갱신해요.</text><text x="55" y="1260" font-size="19" fill="#68776c" font-weight="400">요구사항: docs/tournaments-and-completion-review.md  ·  실제 회원·대회 정보 없는 설명 그림</text></g></svg>
