<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">조축ON 모바일 작전판과 사용 가이드 흐름</title><desc id="desc">2026.10.15 기능확장판 · 운영 b9d8738. 주요 메뉴 네 개, 02·03 스쿼드 전체보기와 초안 편집, 단계별 서버 저장, 감독·코치와 회원의 역할별 가이드. 운영 웹/API 커밋 b9d8738f080d49911b31fcf9ef42b463a23478d8, Flyway V23 적용 확인.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#80968a" stroke-width="1.5"/></marker></defs><rect width="1400" height="980" fill="#f7f8f4"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="54" y="43" font-size="20" fill="#28654d" font-weight="700" text-anchor="start">JOCHOOK ON / 조축ON</text><text x="1346" y="43" font-size="18" fill="#66766d" font-weight="400" text-anchor="end">2026.10.15 기능확장판 · 운영 b9d8738</text><text x="54" y="101" font-size="36" fill="#243c34" font-weight="700" text-anchor="start">휴대폰에서 보고, 고치고, 저장하기</text><text x="54" y="141" font-size="21" fill="#52695d" font-weight="400" text-anchor="start">작전판에서 수정한 내용은 먼저 초안에 반영됩니다. 서버 저장은 기존 단계별 버튼으로 합니다.</text><rect x="54" y="176" width="300" height="108" rx="16" fill="#fff" stroke="#d1ded4"/><text x="74" y="211" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">선수단</text><text x="74" y="246" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">명단 · 선호 포지션</text><rect x="384" y="176" width="300" height="108" rx="16" fill="#fff" stroke="#d1ded4"/><text x="404" y="211" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">경기 기록</text><text x="404" y="246" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">01~04 입력 · 스쿼드</text><rect x="714" y="176" width="300" height="108" rx="16" fill="#fff" stroke="#d1ded4"/><text x="734" y="211" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">선수 기록</text><text x="734" y="246" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">시즌별 기록 조회</text><rect x="1044" y="176" width="300" height="108" rx="16" fill="#e8f3eb" stroke="#d1ded4"/><text x="1064" y="211" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">사용 가이드</text><text x="1064" y="246" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">역할별 설명 · PDF</text><rect x="54" y="318" width="800" height="391" rx="16" fill="#eef4f0" stroke="#d1ded4"/><text x="78" y="351" font-size="25" fill="#28654d" font-weight="700" text-anchor="start">02 계획 / 03 실제 출전 · 스쿼드 한눈에 보기</text><rect x="78" y="377" width="227" height="117" rx="16" fill="#fff" stroke="#d1ded4"/><text x="98" y="412" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">① 전체보기 열기</text><text x="98" y="447" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">11명 배치를 한 화면에</text><text x="98" y="476" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">6종 포메이션 지원</text><rect x="338" y="377" width="227" height="117" rx="16" fill="#fff" stroke="#d1ded4"/><text x="358" y="412" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">② 쿼터·팀 선택</text><text x="358" y="447" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">1~4쿼터 / 자체전 A·B</text><text x="358" y="476" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">팀별 포메이션 표시</text><rect x="598" y="377" width="232" height="117" rx="16" fill="#fff" stroke="#d1ded4"/><text x="618" y="412" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">③ 자리 눌러 편집</text><text x="618" y="447" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">02 배치 · 03 골·도움</text><text x="618" y="476" font-size="17" fill="#52695d" font-weight="400" text-anchor="start">선발·교체 별도 입력</text><path d="M306 434 L334 434" fill="none" stroke="#80968a" stroke-width="2" marker-end="url(#arrow)"/><path d="M566 434 L594 434" fill="none" stroke="#80968a" stroke-width="2" marker-end="url(#arrow)"/><path d="M713 495 L713 527" fill="none" stroke="#80968a" stroke-width="2" marker-end="url(#arrow)"/><rect x="78" y="534" width="752" height="146" rx="16" fill="#fff" stroke="#d1ded4"/><text x="98" y="569" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">입력 완료 · 작전판으로 → 전체보기 닫기</text><text x="98" y="604" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">입력은 현재 초안에 유지 · 닫기는 취소나 서버 저장이 아님</text><text x="98" y="633" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">원래 화면에서 계획 저장 / 출전 기록 저장 버튼 사용</text><text x="98" y="662" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">조회 회원은 작전판·상세 기록만 확인</text><rect x="884" y="318" width="462" height="391" rx="16" fill="#edf3f8" stroke="#d1ded4"/><text x="908" y="351" font-size="25" fill="#285d86" font-weight="700" text-anchor="start">사용 가이드 · 계정 권한 기준</text><rect x="908" y="377" width="414" height="117" rx="16" fill="#fff" stroke="#d1ded4"/><text x="928" y="412" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">감독·코치 → 운영진용</text><text x="928" y="447" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">등록·편집·단계별 저장·초안 복원</text><text x="928" y="476" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">팀 접속 관리와 운영 흐름</text><rect x="908" y="518" width="414" height="117" rx="16" fill="#fff" stroke="#d1ded4"/><text x="928" y="553" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">회원·코드 접속 → 회원용</text><text x="928" y="588" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">선수단·경기·스쿼드·선수 기록 조회</text><text x="928" y="617" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">모바일 목차 / 이전·다음 / PDF</text><text x="908" y="676" font-size="19" fill="#52695d" font-weight="400" text-anchor="start">선수 직책과 실제 로그인 권한은 별개</text><rect x="54" y="753" width="625" height="147" rx="16" fill="#fff" stroke="#d1ded4"/><text x="74" y="788" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">탭의 임시 초안 · 최대 24시간</text><text x="74" y="823" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">같은 계정·팀으로 돌아와 이어서 작성</text><text x="74" y="852" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">직접 로그아웃 시 삭제 · 다른 기기와 동기화 안 됨</text><text x="74" y="881" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">서버 저장이 아니므로 단계별 저장 버튼 확인</text><rect x="714" y="753" width="632" height="147" rx="16" fill="#e8f3eb" stroke="#d1ded4"/><text x="734" y="788" font-size="23" fill="#28654d" font-weight="700" text-anchor="start">서버 저장 · V23 영수증</text><text x="734" y="823" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">경기 + 변경 이력 + 영수증을 함께 저장</text><text x="734" y="852" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">응답 유실은 저장 결과부터 확인 · 같은 요청 재시도</text><text x="734" y="881" font-size="20" fill="#52695d" font-weight="400" text-anchor="start">수정 충돌은 초안 보존 · 자동 덮어쓰기 차단</text><text x="54" y="947" font-size="17" fill="#66766d" font-weight="400" text-anchor="start">실제 회원 정보 없는 설명 그림 · 사용 가이드 원고와 PDF는 같은 원본에서 생성</text></g></svg>