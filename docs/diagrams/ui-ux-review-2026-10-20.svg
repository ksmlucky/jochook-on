<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title description" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title id="title">조축ON UX 점검 요약</title><desc id="description">모바일 390px의 같은 가상 데이터에서 선수 기록 첫 행 위치가 1390.30px에서 837.20px로 39.8% 감소했다. 일부 주요 조작 영역은 36/32px에서 44px, soft 배경 텍스트 대비는 4.32대1에서 4.93대1이 됐다. 작업 완료 시간의 개선을 측정한 것은 아니다. 조회·편집 분리, 초안 보호, 역할별 가이드는 유지하며 상단 통합, 통계 설정 접기, 조작 및 대비, 로고 이탈 보호를 개선한다. 필터 유지, 페이지 이동 일관성, 실제 경기장 관찰은 후속 과제다.</desc><rect x="0" y="0" width="1200" height="1110" rx="0" fill="#f1f5ef"/><text x="48" y="58" font-size="32" fill="#263d34" font-weight="800">조축ON · 한눈에 보는 UX 점검</text><text x="48" y="94" font-size="17" fill="#526457" font-weight="400">2026-10-20  |  배포 후보 · 로컬 개선</text><text x="48" y="137" font-size="23" fill="#245d47" font-weight="700">기능을 더 늘리기 전에, 결과까지 가는 화면을 짧고 분명하게.</text><rect x="48" y="164" width="1104" height="268" rx="16" fill="#fff"/><text x="72" y="201" font-size="19" fill="#263d34" font-weight="700">같은 가상 데이터 · 390px 화면에서 측정</text><text x="72" y="235" font-size="17" fill="#526457" font-weight="400">선수 기록의 첫 표 행까지</text><rect x="72" y="252" width="656" height="38" rx="6" fill="#dce5db"/><text x="88" y="278" font-size="17" fill="#263d34" font-weight="700">개선 전  1390.30px</text><rect x="72" y="300" width="395.0249586420198" height="38" rx="6" fill="#28634e"/><text x="88" y="326" font-size="17" fill="#fff" font-weight="700">개선 후  837.20px</text><text x="72" y="373" font-size="29" fill="#245d47" font-weight="800">39.8% 감소</text><text x="267" y="371" font-size="17" fill="#526457" font-weight="400">첫 결과 위에 쌓인 공간을 약 40% 줄임</text><text x="72" y="405" font-size="15" fill="#526457" font-weight="400">조회 시간이나 사용성 점수가 40% 개선됐다는 의미는 아닙니다.</text><path d="M772 221V399" stroke="#d7e1d4" stroke-width="2"/><text x="802" y="242" font-size="16" fill="#526457" font-weight="400">주요 조작 영역</text><text x="802" y="279" font-size="25" fill="#245d47" font-weight="800">36 / 32px → 44px</text><text x="802" y="328" font-size="16" fill="#526457" font-weight="400">soft 배경 위 텍스트 대비</text><text x="802" y="365" font-size="25" fill="#245d47" font-weight="800">4.32 : 1 → 4.93 : 1</text><text x="48" y="480" font-size="23" fill="#263d34" font-weight="800">유지할 강점</text><rect x="48" y="500" width="352" height="132" rx="16" fill="#e3eedf"/><text x="70" y="535" font-size="20" fill="#245d47" font-weight="700">조회와 편집 분리</text><text x="70" y="566" font-size="17" fill="#526457" font-weight="400">결과를 먼저 보고</text><text x="70" y="594" font-size="17" fill="#526457" font-weight="400">수정은 별도 행동으로</text><rect x="424" y="500" width="352" height="132" rx="16" fill="#e3eedf"/><text x="446" y="535" font-size="20" fill="#245d47" font-weight="700">초안 보호</text><text x="446" y="566" font-size="17" fill="#526457" font-weight="400">실패·이탈 상황에서</text><text x="446" y="594" font-size="17" fill="#526457" font-weight="400">입력한 내용과 상태 구분</text><rect x="800" y="500" width="352" height="132" rx="16" fill="#e3eedf"/><text x="822" y="535" font-size="20" fill="#245d47" font-weight="700">역할별 가이드</text><text x="822" y="566" font-size="17" fill="#526457" font-weight="400">운영진·회원에 맞는 안내</text><text x="822" y="594" font-size="17" fill="#526457" font-weight="400">앱과 PDF의 공통 원고</text><text x="48" y="681" font-size="23" fill="#263d34" font-weight="800">이번 개선</text><rect x="48" y="701" width="258" height="158" rx="16" fill="#fff"/><text x="68" y="731" font-size="14" fill="#526457" font-weight="700">01</text><text x="68" y="763" font-size="21" fill="#263d34" font-weight="800">상단 통합</text><text x="68" y="799" font-size="16" fill="#526457" font-weight="400">팀 홈을 명시하고</text><text x="68" y="825" font-size="16" fill="#526457" font-weight="400">중복 안내를 줄임</text><text x="310" y="789" font-size="18" fill="#526457" font-weight="700">→</text><rect x="330" y="701" width="258" height="158" rx="16" fill="#fff"/><text x="350" y="731" font-size="14" fill="#526457" font-weight="700">02</text><text x="350" y="763" font-size="21" fill="#263d34" font-weight="800">통계 설정 접기</text><text x="350" y="799" font-size="16" fill="#526457" font-weight="400">검색·결과를 앞에</text><text x="350" y="825" font-size="16" fill="#526457" font-weight="400">미입력 경고는 유지</text><text x="592" y="789" font-size="18" fill="#526457" font-weight="700">→</text><rect x="612" y="701" width="258" height="158" rx="16" fill="#fff"/><text x="632" y="731" font-size="14" fill="#526457" font-weight="700">03</text><text x="632" y="763" font-size="21" fill="#263d34" font-weight="800">터치·대비</text><text x="632" y="799" font-size="16" fill="#526457" font-weight="400">조작은 44px 확보</text><text x="632" y="825" font-size="16" fill="#526457" font-weight="400">본문을 더 선명하게</text><text x="874" y="789" font-size="18" fill="#526457" font-weight="700">→</text><rect x="894" y="701" width="258" height="158" rx="16" fill="#fff"/><text x="914" y="731" font-size="14" fill="#526457" font-weight="700">04</text><text x="914" y="763" font-size="21" fill="#263d34" font-weight="800">로고 이탈 보호</text><text x="914" y="799" font-size="16" fill="#526457" font-weight="400">선택 후 이동 확인</text><text x="914" y="825" font-size="16" fill="#526457" font-weight="400">저장 중 이동 차단</text><rect x="48" y="889" width="1104" height="133" rx="16" fill="#263d34"/><text x="72" y="928" font-size="22" fill="#fff" font-weight="800">다음에 확인할 것</text><text x="72" y="969" font-size="19" fill="#fff" font-weight="600">조회 조건 유지</text><text x="368" y="969" font-size="19" fill="#fff" font-weight="600">목록 페이지 이동의 일관성</text><text x="797" y="969" font-size="19" fill="#fff" font-weight="600">실제 경기장 사용 관찰</text><text x="72" y="1001" font-size="15" fill="#dce8dc" font-weight="400">기능·정책을 임의로 추가하지 않고, 실제 불편과 재현 결과를 바탕으로 순서를 정합니다.</text><text x="48" y="1063" font-size="16" fill="#526457" font-weight="400">운영 반영은 배포 및 공개 URL 검증 후 확정 · 실제 팀·회원 정보 없음</text></svg>
