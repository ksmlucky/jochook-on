<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#f7f8f4"/><g font-family="Malgun Gothic,sans-serif" fill="#243c34"><text x="36" y="48" font-size="28" font-weight="700">조축ON · 배치는 02, 골 기록은 03</text><text x="36" y="80" font-size="16">2026-10-19 배치·결과 입력 간소화 / 배포 상태는 기능 문서 참조</text><rect x="36" y="120" width="350" height="225" rx="18" fill="white" stroke="#cad9cd"/><text x="56" y="165" font-size="23" font-weight="700">01 참석 명단</text><text x="56" y="210" dy="0" font-size="17">참석 선수 선택</text><text x="56" y="210" dy="38" font-size="17">자체전 A·B팀 구분</text><text x="394" y="233" font-size="28">→</text><rect x="426" y="120" width="350" height="225" rx="18" fill="white" stroke="#cad9cd"/><text x="446" y="165" font-size="23" font-weight="700">02 스쿼드 배치</text><text x="446" y="210" dy="0" font-size="17">자리 → 이름순 목록 → 즉시 배치</text><text x="446" y="210" dy="38" font-size="17">선발이 있을 때만 + 교체</text><text x="446" y="210" dy="76" font-size="17">골 입력·경기 엑셀 제거</text><text x="784" y="233" font-size="28">→</text><rect x="816" y="120" width="350" height="225" rx="18" fill="white" stroke="#cad9cd"/><text x="836" y="165" font-size="23" font-weight="700">03 결과·코멘트</text><text x="836" y="210" dy="0" font-size="17">쿼터/전후반 → 골·도움 연결</text><text x="836" y="210" dy="38" font-size="17">구간별 저장 후 같은 화면 유지</text><text x="836" y="210" dy="76" font-size="17">스코어·코멘트 → 경기 완료</text><text x="36" y="402" font-size="20">오른쪽 아래: 목록 / 다음 → 마지막 단계: 목록 / 완료</text><text x="36" y="442" font-size="17">구간별 저장은 현재 경기의 다른 변경도 함께 저장합니다. 완료 전에는 작성 중으로 보관합니다.</text></g></svg>