<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">조축ON 통합 경기 입력 흐름</title><desc id="desc">3단계 통합. 참석 명단, 스쿼드와 개인 기록, 결과의 세 단계. 중간 저장은 작성 중 상태이고 경기 완료를 눌러 기본 시즌 집계에 포함한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286754"/></marker></defs><rect width="1120" height="620" fill="#f5f7f1"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#203d34"><text x="40" y="49" font-size="15" fill="#64756c">조축ON · 2026-10-19 · 3단계 통합 · 배포 상태는 기능 문서 참조</text><text x="40" y="96" font-size="31" font-weight="700">배치는 한 번, 기록은 같은 작전판에서</text><text x="40" y="132" font-size="18">계획 복사와 실제 참석 재확인 없이 3단계로 입력해요.</text><rect x="40" y="174" width="316" height="232" rx="18" fill="white" stroke="#cbd9cf"/><rect x="60" y="194" width="48" height="36" rx="10" fill="#286754"/><text x="84" y="219" text-anchor="middle" fill="white" font-size="18">01</text><text x="60" y="270" font-size="24" font-weight="700">참석 명단</text><text x="60" y="307" font-size="16">투표한 선수를 체크</text><text x="60" y="338" font-size="16">선택하면 참석으로 반영</text><text x="60" y="369" font-size="16">자체전은 A·B팀 먼저 지정</text><path d="M362 288h32" fill="none" stroke="#286754" stroke-width="3" marker-end="url(#arrow)"/><rect x="402" y="174" width="316" height="232" rx="18" fill="white" stroke="#cbd9cf"/><rect x="422" y="194" width="48" height="36" rx="10" fill="#286754"/><text x="446" y="219" text-anchor="middle" fill="white" font-size="18">02</text><text x="422" y="270" font-size="24" font-weight="700">스쿼드·개인 기록</text><text x="422" y="307" font-size="16">자동 편성 또는 직접 배치</text><text x="422" y="338" font-size="16">같은 작전판에서 교체·골·도움</text><text x="422" y="369" font-size="16">한눈에 보기에서도 바로 수정</text><path d="M724 288h32" fill="none" stroke="#286754" stroke-width="3" marker-end="url(#arrow)"/><rect x="764" y="174" width="316" height="232" rx="18" fill="white" stroke="#cbd9cf"/><rect x="784" y="194" width="48" height="36" rx="10" fill="#286754"/><text x="808" y="219" text-anchor="middle" fill="white" font-size="18">03</text><text x="784" y="270" font-size="24" font-weight="700">결과·코멘트</text><text x="784" y="307" font-size="16">최종 스코어와 코멘트 입력</text><text x="784" y="338" font-size="16">개인 기록 합계 확인</text><text x="784" y="369" font-size="16">경기 완료 → 기본 시즌 집계</text><rect x="40" y="438" width="1040" height="136" rx="18" fill="#e8efe7"/><text x="65" y="477" font-size="20" font-weight="700">중간 저장 후 언제든 이어서 작성</text><text x="65" y="510" font-size="17">경기 전에는 스쿼드만 저장 → 경기 후 같은 화면에서 골·도움 추가 → 경기 완료</text><text x="65" y="545" font-size="15">선수 이동 시 기록도 함께 이동 · 교체는 각각 0.5쿼터 · 득점 있는 선수의 배치 삭제는 차단</text></g></svg>