<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">조축ON 기능 요약</title><desc id="desc">조기축구팀의 선수·참석·스쿼드·경기 기록을 한곳에 모으는 웹 서비스입니다. 운영진은 기록을 관리하고, 회원은 팀의 경기와 개인 기록을 확인합니다. 01 참석: 경기 참가자 확인: 자체전 팀별 명단 → 02 스쿼드: 자동 편성·직접 배치: 포지션과 교체 관리 → 03 경기 결과: 골·도움·스코어 기록: 결과 이미지 공유 설명용 도식입니다.</desc><rect width="1200" height="720" rx="24" fill="#EEF5E9"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" fill="#263D2A"><rect x="52" y="47" width="7" height="25" rx="3" fill="#34784D"/><text x="74" y="67" font-size="21" font-weight="600" fill="#34784D">개인 프로젝트 · 조기축구팀 운영</text><text x="52" y="148" font-size="58" font-weight="800" letter-spacing="-2">조축ON</text><text x="54" y="203" font-size="28" letter-spacing="-.6">참석부터 스쿼드, 경기 결과까지 한 흐름으로 관리합니다.</text><text x="54" y="257" font-size="17" letter-spacing="3" fill="#34784D">HOW IT WORKS</text><g transform="translate(52,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DCEACA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#34784D">01</text><g transform="translate(60,51)"><circle cx="58" cy="30" r="13" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="119" cy="30" r="13" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M99 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="30" r="13" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">01 참석</text><text x="28" y="248" font-size="23">경기 참가자 확인</text><text x="28" y="281" font-size="23" fill="#34784D">자체전 팀별 명단</text></g><g transform="translate(422,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DCEACA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#34784D">02</text><g transform="translate(60,51)"><rect x="39" y="0" width="164" height="107" rx="2" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M121 0V107 M39 33h24v40H39 M203 33h-24v40h24" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="121" cy="53" r="19" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="63" cy="53" r="5" fill="#34784D"/><circle cx="96" cy="22" r="5" fill="#34784D"/><circle cx="96" cy="84" r="5" fill="#34784D"/><circle cx="147" cy="29" r="5" fill="#34784D"/><circle cx="147" cy="77" r="5" fill="#34784D"/><circle cx="180" cy="53" r="5" fill="#34784D"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">02 스쿼드</text><text x="28" y="248" font-size="23">자동 편성·직접 배치</text><text x="28" y="281" font-size="23" fill="#34784D">포지션과 교체 관리</text></g><g transform="translate(792,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DCEACA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#34784D">03</text><g transform="translate(60,51)"><rect x="43" y="10" width="155" height="88" rx="8" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 27v55 M80 49h9 M153 49h9" fill="none" stroke="#34784D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="70" font-size="37" font-weight="700" fill="#34784D">3</text><text x="148" y="70" font-size="37" font-weight="700" fill="#34784D">2</text></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">03 경기 결과</text><text x="28" y="248" font-size="23">골·도움·스코어 기록</text><text x="28" y="281" font-size="23" fill="#34784D">결과 이미지 공유</text></g><line x1="54" y1="629" x2="1146" y2="629" stroke="#34784D" opacity=".2"/><text x="54" y="668" font-size="20" fill="#34784D">현재 경기 입력 3단계 기준 · 실제 선수 정보 없이 만든 기능 안내</text><text x="1145" y="701" text-anchor="end" font-size="12" letter-spacing="1.4" opacity=".65">FEATURE OVERVIEW · NOT A LIVE SCREENSHOT</text></g></svg>