<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4d3b" />
    <meta name="robots" content="noindex" />
    <title>인터넷 연결이 필요해요 · 조축ON</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; background: #f6f7f2; color: #243b32; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.7; }
      main { width: min(100%, 440px); padding: 36px 28px; background: #fff; border: 1px solid #dee5db; border-radius: 24px; box-shadow: 0 12px 40px #1e4d3b10; }
      .brand { margin: 0 0 24px; color: #28624c; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
      h1 { margin: 0 0 16px; font-size: clamp(24px, 6vw, 30px); line-height: 1.4; letter-spacing: -.04em; }
      p { margin: 0 0 16px; color: #66756d; }
      .note { margin-top: 20px; padding: 14px 16px; border-radius: 12px; background: #f6f7f2; font-size: 14px; }
      a { display: block; margin-top: 28px; padding: 13px 20px; border-radius: 12px; background: #28624c; color: #fff; text-align: center; font-weight: 700; text-decoration: none; }
      a:hover { background: #1e4d3b; }
      a:focus-visible { outline: 3px solid #e8a331; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">조축ON</p>
      <h1>인터넷 연결이 필요해요</h1>
      <p>Wi-Fi 또는 모바일 데이터 연결을 확인한 뒤 다시 접속해 주세요.</p>
      <p class="note">오프라인에서는 선수·경기 기록을 조회하거나 저장할 수 없습니다. 연결이 끊긴 동안 입력한 내용은 자동으로 저장되지 않습니다.</p>
      <a href="/">연결 확인 후 다시 접속</a>
    </main>
  </body>
</html>
